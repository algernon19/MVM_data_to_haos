import:
  name: MVM CSV importálása
  description: >-
    Beolvassa a beállított import könyvtárban található MVM Next CSV export
    fájlokat, a benne lévő időszak szerint átnevezi őket, és teljesen
    újraszámolja az mvm_next:imported_consumption és mvm_next:imported_cost
    long-term statisztikát.
  fields:
    file_path:
      name: Fájl elérési út
      description: >-
        Opcionális: egyetlen CSV fájl kényszerített újrafeldolgozása
        (abszolút útvonal, vagy az import könyvtárhoz viszonyított relatív
        fájlnév). Ha üresen marad, a teljes import könyvtár átvizsgálásra
        kerül.
      required: false
      example: "/homeassistant/mvm_next/mvm_2026-08.csv"
      selector:
        text:

upload:
  name: MVM CSV feltöltése
  description: >-
    CSV fájl feltöltése a böngészőből az import könyvtárba, majd azonnali
    feldolgozása. A fájl a benne lévő időszak szerinti néven kerül mentésre
    (pl. mvm_2026-08.csv), így a korábbi exportokat nem írja felül.
  fields:
    file:
      name: CSV fájl
      description: A feltöltendő MVM Next CSV export fájl.
      required: true
      selector:
        file:
          accept: ".csv,text/csv"
